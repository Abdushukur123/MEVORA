<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEVORA Admin</title><style>body{font-family:Arial;background:#f5f2e9;color:#23372d;margin:0;padding:25px}main{max-width:1100px;margin:auto}section{background:white;padding:18px;border-radius:14px;margin:16px 0}input,select,textarea,button{padding:10px;border:1px solid #ddd;border-radius:8px;margin:4px;font:inherit}button{background:#173f32;color:white;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #eee;font-size:14px}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}small{color:#777}</style></head><body><main><h1>MEVORA — Admin panel</h1><p><a href="/">← Do‘konga qaytish</a></p><section id="login"><h2>Admin kirishi</h2><input id="user" placeholder="Login" value="admin"><input id="pass" type="password" placeholder="Parol"><button onclick="login()">Kirish</button><p id="err"></p></section><div id="panel" hidden><section><h2>Mahsulot qo‘shish / tahrirlash</h2><input id="pid" type="hidden"><div class="form"><input id="name" placeholder="Mahsulot nomi"><input id="cat" placeholder="Kategoriya"><select id="unit"><option value="kg">Kilogramm</option><option value="dona">Dona / paket</option></select><input id="retail" type="number" placeholder="Chakana narx"><input id="wholesale" type="number" placeholder="Ulgurji narx"><input id="stock" type="number" placeholder="Ombordagi miqdor" value="100"><input id="photo" type="file" accept="image/*"></div><textarea id="desc" placeholder="Tavsif" style="width:95%"></textarea><p><button onclick="saveProduct()">Saqlash</button><button onclick="clearForm()">Tozalash</button></p></section><section><h2>Mahsulotlar</h2><div id="plist"></div></section><section><h2>Buyurtmalar</h2><div id="orders"></div></section></div></main><script>
let token='',items=[];const headers=()=>({'Authorization':'Bearer '+token,'Content-Type':'application/json'}),money=n=>new Intl.NumberFormat('uz-UZ').format(n)+' so‘m';
async function login(){let f=new URLSearchParams();f.set('username',user.value);f.set('password',pass.value);let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:f});let d=await r.json();if(!r.ok){err.textContent=d.detail;return}token=d.access_token;loginBox();refresh()}
function loginBox(){document.querySelector('#login').hidden=true;document.querySelector('#panel').hidden=false}
async function refresh(){items=await (await fetch('/api/products')).json();plist.innerHTML='<table><tr><th>Mahsulot</th><th>Birlik</th><th>Chakana</th><th>Ulgurji</th><th>Amal</th></tr>'+items.map(p=>`<tr><td>${p.name}</td><td>${p.unit}</td><td>${money(p.retail_price)}</td><td>${money(p.wholesale_price)}</td><td><button onclick="edit(${p.id})">Tahrirlash</button><button onclick="del(${p.id})">O‘chirish</button></td></tr>`).join('')+'</table>';let r=await fetch('/api/admin/orders',{headers:headers()});let os=await r.json();orders.innerHTML=os.length?'<table><tr><th>#</th><th>Mijoz</th><th>Telefon</th><th>Mahsulotlar</th><th>Jami</th><th>Holat</th></tr>'+os.map(o=>`<tr><td>${o.id}</td><td>${o.customer_name}<br>${o.address}</td><td>${o.phone}</td><td>${o.items.map(i=>i.name+' — '+i.quantity+' '+i.unit).join('<br>')}</td><td>${money(o.total)}</td><td><select onchange="status(${o.id},this.value)">${['Yangi','Qabul qilindi','Tayyorlanmoqda','Yuborildi','Yakunlandi','Bekor qilindi'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')+'</table>':'Hozircha buyurtma yo‘q.'}
function edit(id){let p=items.find(x=>x.id===id);pid.value=p.id;name.value=p.name;cat.value=p.category;unit.value=p.unit;retail.value=p.retail_price;wholesale.value=p.wholesale_price;stock.value=p.stock;desc.value=p.description;window.scrollTo(0,0)}
function clearForm(){pid.value='';name.value='';cat.value='';retail.value='';wholesale.value='';desc.value='';photo.value='';}
async function saveProduct(){let image=items.find(p=>p.id==pid.value)?.image||'';if(photo.files[0]){let fd=new FormData();fd.append('file',photo.files[0]);let up=await fetch('/api/upload',{method:'POST',headers:{'Authorization':'Bearer '+token},body:fd});if(!up.ok)return alert('Rasm yuklanmadi');image=(await up.json()).image}let body={name:name.value,category:cat.value||'Quritilgan mevalar',unit:unit.value,retail_price:+retail.value,wholesale_price:+wholesale.value,stock:+stock.value,description:desc.value,image,active:true};let id=pid.value,r=await fetch(id?'/api/products/'+id:'/api/products',{method:id?'PUT':'POST',headers:headers(),body:JSON.stringify(body)});if(!r.ok)return alert('Saqlashda xatolik');clearForm();refresh()}
async function del(id){if(!confirm('Mahsulot o‘chirilsinmi?'))return;await fetch('/api/products/'+id,{method:'DELETE',headers:headers()});refresh()}
async function status(id,s){await fetch('/api/admin/orders/'+id+'?status='+encodeURIComponent(s),{method:'PATCH',headers:headers()});refresh()}
</script></body></html>
